  # -- 输华双边安排(2026-10 按样例补; 对华影响最直接的一类) --
  # 样例实测: 马来西亚观赏鱼进口议定书、中俄活体驯鹿输华要求、西班牙饲用水生动物蛋白、
  # 乌拉圭牛黄、巴基斯坦干坚果——这类"输华议定书"是外国准入侧对我国最直接的抓手,
  # 但既不进 WTO ePing(未被通报为 SPS 措施), 也常挂在对方商务部/外交部而非检疫机构站点,
  # 英文通用检索式基本捞不到, 必须用中文"输华/议定书/检疫和卫生要求"专门扫。
  protocols:
    - {cn: 输华检疫议定书, en: protocol on inspection quarantine and sanitary requirements, aliases: ["输华议定书", "输华检验检疫和卫生要求", "输华检疫和卫生要求", "双边议定书"]}
    - {cn: 输华议定书(签署), en: protocol signed, aliases: ["关于…输华检疫", "signed on", "议定书签署", "在…签署"]}
    - {cn: 允许进口产品范围, en: scope of products permitted for import, aliases: ["允许进口产品范围", "允许进口产品", "即日起允许符合以下要求的产品进口"]}
    - {cn: 境外生产企业注册登记, en: overseas establishment registration, aliases: ["注册登记", "获得在华注册", "境外生产企业注册", "GACC 注册"]}
    - {cn: 证书附加声明(输华), en: additional declaration for export to China, aliases: ["证书附加声明栏", "additional declaration", "附加声明"]}
    - {cn: 中俄(中欧亚)输华检疫安排, en: China-Russia bilateral quarantine arrangement, aliases: ["输华活体驯鹿", "双边协商", "一致意见"]}

  # -- 文书类型(2026-10 按样例补: 样例标题几乎全部是"某国发布/修订/批准某类文书")
  # 意义: 政策动作的检索面不是"国 × 商品", 而是"文书类型 × 主题"。
  # 按国别扫易漏(不知道某国近期有无动作), 按文书类型扫可横切全库, 是样例的高产规律。
  instruments:
    - {cn: 决议, en: resolution, aliases: ["Resolution", "决议草案", "第…号决议", "决议修订"]}
    - {cn: 条例, en: ordinance / regulation, aliases: ["Ordinance", "条例修订", "条例生效", "生物安全条例"]}
    - {cn: 授权条例(欧盟), en: delegated regulation, aliases: ["授权条例", "Delegated Regulation", "授权法规", "Delegated Act"]}
    - {cn: 实施条例(欧盟), en: implementing regulation, aliases: ["实施条例", "Implementing Regulation", "实施规则"]}
    - {cn: 紧急措施通报, en: emergency measure notification, aliases: ["紧急措施", "紧急卫生措施", "紧急通告", "Emergency Measure"]}
    - {cn: 修订案, en: amendment, aliases: ["修正案", "修订并补充", "Amending Act", "Decree on amendment"]}
    - {cn: 征求意见稿, en: draft for consultation, aliases: ["征求意见", "草案", "公开征询", "draft amendment", "征求意见稿"]}
    - {cn: 通告, en: memorandum order, aliases: ["通告", "第…号通告", "Memorandum Order"]}
    - {cn: 命令, en: order / command, aliases: ["命令", "第…号命令", "Order", "暂时停止进口的命令"]}
    - {cn: 批准与生效, en: approval and commencement, aliases: ["将于…生效", "生效日期", "自…起施行", "commencement", "comes into force", "effective date"]}
    - {cn: 废止, en: repeal, aliases: ["废止", "废除", "取代", "repeal", "supersede", "取代…号决议"]}
    - {cn: 名录/清单修订, en: list amendment, aliases: ["清单修订", "名录修订", "易感物种清单", "准许品种", "标准许可证"]}
    - {cn: 通报号, en: notification symbol, aliases: ["G/SPS/N/", "G/TBT/N/", "补遗通报", "Add.", "Corrigendum"]}

# ---- 政策变化监测检索模板(global-policy-search Skill) ----
# 范围: 仅外国政府的动植物检疫管控政策变化。
# 中国海关总署公告不作为政策记录采集; 仅作为影响研判的背景资料。
# 组合方式: 国家(policy_keywords 涉及国) × 关键词组 × 动作动词。
policy_queries:
  sps:             # WTO SPS 通报(各成员措施变化官方渠道)
    - 'site:eping.wto.org SPS emergency measure animal {month_en_year}'
    - 'site:eping.wto.org SPS plant phytosanitary {month_en_year}'
    - 'G/SPS/N "{disease_en}" OR "import suspension" {year}'
    - '"G/SPS/N/" comment period animal OR plant health {month_en_year}'
  official:        # 重点伙伴官方检疫机构公告
    - '"{country}" suspends imports livestock "animal health" {month_en_year}'
    - '"{country}" lifts ban imports poultry OR beef OR pork {month_en_year}'
    - 'site:aphis.usda.gov import ban OR suspension {month_en_year}'
    - '"European Commission" SERS "emergency measures" animal health {month_en_year}'
    - '"{country}" import suspension OR ban "{disease_en}" {month_en_year}'
  disease_triggered:  # 因动植物检疫事件发布的连带贸易措施
    - '"{disease_en}" "{country}" "suspends imports" OR "bans imports" {month_en_year}'
    - '"{disease_en}" "{country}" trade restriction OR import requirement {month_en_year}'
  product_access:  # 商品 × 准入动作
    - '"{country}" import requirements "animal origin products" OR "fishery products" {month_en_year}'
    - '"{country_cn}" "{product_cn}" 进口 检疫 要求 公告 {year}'
    - '"{country}" pet food OR "feed ingredients" import conditions {year}'
    - 'gelatin OR "chondroitin sulfate" OR glucosamine OR chitosan import "{country}" {year}'
  animals:         # 活动物/繁殖材料检疫条件
    - '"{country}" equines OR horses import health requirements {year}'
    - '"day-old chicks" OR "fertile hatching eggs" import conditions "{country}" {year}'
    - '"{country}" "breeding swine" OR "breeding cattle" OR "genetic material" import {year}'
    - 'bees OR "live rabbits" OR "companion animals" import requirements "{country}" {year}'
    - '"{country}" "live aquatic animals" OR "ornamental fish" import health {year}'
  plants:          # 植物检疫与繁殖材料
    - 'IPPC "emergency measures" plant pest {month_en_year}'
    - '"{country}" seeds OR "nursery stock" OR "tissue culture" phytosanitary import {year}'
    - 'EPPO alert OR "reporting service" quarantine pest {month_en_year}'
    - '"{country_cn}" 植物检疫 有害生物 名录 OR 通报 {year}'
  biologics:       # 生物制品与病原微生物监管
    - '"{country}" "cell lines" OR "bovine serum" OR "viral vectors" import requirements {year}'
    - '"pathogenic microorganisms" import OR handling requirements "{country}" {year}'
    - 'veterinary biologicals OR "diagnostic kits" registration OR import authorization "{country}" {year}'
    - '实验室 高致病性 病原微生物 审批 OR 目录 {year}'
  certification:   # 证书/许可/标识/隔离流程
    - '"{country}" "import permit" OR "official veterinary certificate" changes {year}'
    - 'microchip OR "ISO 11784" OR "closed leg ring" import requirement birds OR "pet animals" {year}'
    - 'electronic certification OR ePhyto phytosanitary "{country}" {year}'
    - 'post-entry quarantine requirements "{country}" animals OR plants {year}'
  regulation:      # 法规修订与制度调整
    - '"{country}" amends OR revises "veterinary legislation" OR "animal health law" {year}'
    - 'draft OR proposed amendment "import health standards" "{country}" {year}'
    - '"{country}" "advance notification" OR "prior notification" imports animals {year}'
    - '"{country_cn}" 修订 进出口 检疫 要求 OR 管理办法 {year}'
  organisations:   # 国际组织行动与呼吁
    - 'WOAH OR FAO urges OR calls action "{disease_en}" {year}'
    - 'FAO "GPP-TAD" OR ECTAD animal disease action {year}'
    - 'WOAH recommendation OR statement trade measures animal health {year}'
  country_sweep:    # 国家 × 主题词组 × 动作词,不依赖单一病害
    - '"{country}" (amends OR revises OR updates OR introduces OR suspends OR resumes) (quarantine OR import requirement OR veterinary certificate OR phytosanitary) {year}'
    - '"{country}" (animal health law OR biosecurity law OR veterinary legislation) (draft OR amendment OR regulation) {year}'
    - '"{country}" (SPS OR G/SPS/N OR TBT) (animal OR plant OR feed OR veterinary) {year}'
    - '"{country}" (microchip OR "ISO 11784" OR "advance notification" OR "import permit") animals {year}'
    - '"{country}" (cell lines OR "bovine serum" OR "diagnostic kits" OR microorganisms) import regulation {year}'
    - '"{country_cn}" 动植物 检疫 (修订 OR 调整 OR 新增 OR 取消 OR 暂停 OR 恢复) {year}'
  state_us:        # 美国州级农业/州兽医/植物监管机构
    - '"{state}" department of agriculture (quarantine OR import OR animal health OR plant health) {year}'
    - '"{state}" state veterinarian (order OR quarantine OR disease control) {year}'
    - '"{state}" plant regulatory official (phytosanitary OR quarantine pest OR nursery stock) {year}'
    - 'site:gov "{state}" "animal health" "import requirements" {year}'

  # ========== 2026-10 新增: 按样例实测的四个高产通道 ==========
  # 样例回溯结论(2026-10-15 实测, 详见 policy_queries 顶部说明):
  #   1) 中文 SPS/TBT 聚合站(gdtbt/tbtguide/hntbt/gxzl/wzisps 等)单次可返回 8 条带完整
  #      通报号与生效日期的记录, 且标题已是可直接入库的中文规范表述——是当前日产量最高的通道;
  #   2) 英文 `site:官方域 + 长自然语言` 命中率极低(sag.gob.cl 西语检索 0 命中),
  #      但 `site:官方域 + 英文术语` 可命中(agriculture.gov.au 6 命中);
  #   3) 输华议定书类几乎不进 ePing, 必须中文专门扫;
  #   4) 按"文书类型"横切比按"国别 × 商品"纵切覆盖面更广。
  cn_sps_aggregator:  # 中文 SPS 通报聚合站(日产量最高; 强制回溯 ePing/WTO 原文后才可 verified)
    - '通报 "G/SPS/N/" 动物 检疫 进口 卫生要求 {month_en_year}'
    - '通报 植物检疫要求 修订 OR 废止 决议 {month_en_year}'
    - 'WTO/SPS通报 紧急措施 暂停进口 OR 禁止进口 {month_en_year}'
    - '通报 补遗 OR Add. 生效日期 公告 {month_en_year}'
  cn_protocol:      # 输华双边议定书/检疫和卫生要求(不进 ePing, 必须中文扫)
    - '输华 检疫 卫生要求 议定书 签署 {year}'
    - '"关于" 输华 检疫和卫生要求 议定书 即日起允许 进口'
    - '输华 议定书 修订 OR 生效 OR 更新 {month_en_year}'
    - '注册登记 境外生产企业 输华 检疫 议定书 公告 {year}'
  instruments:     # 文书类型横切(按样例: 标题几乎都是"某国发布/修订/批准某类文书")
    - '"{instrument}" quarantine OR "animal health" OR phytosanitary {month_en_year}'
    - '"{instrument}" import requirements animals OR plants {month_en_year}'
    - '通报 OR 条例 OR 决议 OR 命令 修订 检疫 卫生要求 {month_en_year}'
  official_domain: # 官方域直击(短术语优先, 不要拼长自然语言——实测长句 0 命中)
    - 'site:{official_domain} import requirements'
    - 'site:{official_domain} quarantine OR biosecurity OR phytosanitary'
    - 'site:{official_domain} resolution OR ordinance OR decree'
    - 'site:{official_domain} notification OR circular OR amendment'
