  - id: vn-mard
    name: 越南农业与农村发展部
    url: https://www.mard.gov.vn/Pages/default.aspx
    coverage: [animal, plant]
    tier: 1
    schedule: am
    lang: [vi]
    method: browse
    notes: 陆地边境邻国; ASF/HPAI 常年活跃
  - id: tr-tarimorman
    name: 土耳其农林部
    url: https://www.tarimorman.gov.tr/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [tr]
    method: browse
    notes: FMD/LSD 地理通道国家
  - id: au-agriculture
    name: 澳大利亚农林渔业部
    url: https://www.agriculture.gov.au/
    coverage: [animal, plant]
    tier: 1
    schedule: am
    lang: [en]
    method: browse
    notes: 主要贸易伙伴; 无疫国动向外溢参考价值高
  - id: nz-beehive
    name: 新西兰政府新闻发布(Beehive)
    url: https://www.beehive.govt.nz/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: 政府新闻总入口(非检疫专页), 站内检索疫情相关公告

