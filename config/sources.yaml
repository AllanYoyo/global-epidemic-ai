# ============================================================
# 疫见全球 · 情报源清单与病害关注表
# 说明:
#   - sources 供 global-epidemic-search Skill 使用, tier 越小越权威
#   - 每个源带 schedule 运行档位(am/pm/weekly/passive), 由 crontab 双扫调度
#   - watchlist 带 tier 分级(core=每轮必查, general=仅晨扫; 未标 tier 视为 general)
#   - 所有 URL 是检索入口; 站点改版后由搜索重新定位, 不需要频繁维护本文件
# ============================================================

# ---- 运行档位: crontab 调用 scripts/run_scan.sh 触发 ----
runs:
  am:     {time: "06:30", desc: 全量晨扫, 产出: 日报+推送, sources: [am, am_pm], watchlist: [core, general]}
  pm:     {time: "18:00", desc: 增量晚扫, 产出: 刷新当日日报, sources: [am_pm], watchlist: [core]}
  weekly: {on: 每周一并入晨扫, sources: [weekly], watchlist: [core, general]}
  passive: {desc: 不主动扫描, 仅作核验时的交叉回溯, sources: [passive]}
  policy: {time: "07:30", desc: 政策变化扫(检疫/进出口管控动作), 产出: 政策日报, sources: [measures], watchlist: [core]}

watchlist:
  animal:
    - {cn: 非洲猪瘟, en: African Swine Fever, abbrev: ASF, tier: core}
    - {cn: 高致病性禽流感, en: Highly pathogenic avian influenza, abbrev: HPAI, tier: core}
    - {cn: 口蹄疫, en: Foot-and-mouth disease, abbrev: FMD, tier: core}
    - {cn: 小反刍兽疫, en: Peste des petits ruminants, abbrev: PPR}
    - {cn: 结节性皮肤病, en: Lumpy skin disease, abbrev: LSD}
    - {cn: 经典猪瘟, en: Classical swine fever, abbrev: CSF}
    - {cn: 新城疫, en: Newcastle disease, abbrev: ND}
    - {cn: 非洲马瘟, en: African horse sickness, abbrev: AHS}
  plant:
    - {cn: 番茄褐色皱果病毒, en: Tomato brown rugose fruit virus, abbrev: ToBRFV}
    - {cn: 香蕉枯萎病4号小种, en: Fusarium wilt (TR4), abbrev: TR4}
    - {cn: 小麦秆锈病Ug99, en: Wheat stem rust Ug99, abbrev: Ug99}
    - {cn: 沙漠蝗, en: Desert Locust, abbrev: DL}
    - {cn: 草地贪夜蛾, en: Fall Armyworm, abbrev: FAW}
    - {cn: 柑橘黄龙病, en: Citrus greening (Huanglongbing), abbrev: HLB}
    - {cn: 马铃薯晚疫病, en: Potato late blight, abbrev: PLB}
    - {cn: 松材线虫病, en: Pine wilt disease, abbrev: PWD}

# ---- 情报源分级: 1 官方(可直接支撑 verified) / 2 专业(需交叉) / 3 媒体(仅线索) ----
# schedule 档位: am_pm=晨扫+晚扫 / am=仅晨扫 / weekly=每周一晨扫附加 / passive=不主动扫
sources:
  # ========== Tier 1: 官方权威 ==========
  - id: woah-wahis
    name: WOAH WAHIS(世界动物卫生组织疫情信息系统)
    url: https://wahis.woah.org/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    lang: [en, fr]
    method: browse
    notes: 重点看 Immediate notifications 与 Follow-up reports; 全量历史数据需注册 WAHIS API
  - id: fao-empres-i
    name: FAO 全球动物疫病信息系统(EMPRES-i)
    url: https://www.fao.org/global-animal-disease-information-system/en/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    lang: [en]
    method: browse
    notes: 有事件地图与导出; 与 WAHIS 通报高度重叠, 适合做交叉验证
  - id: who-don
    name: WHO 疫情新闻(Disease Outbreak News)
    url: https://www.who.int/emergencies/disease-outbreak-news
    coverage: [human, zoonosis]
    tier: 1
    schedule: am_pm
    lang: [en]
    method: browse
    notes: 关注人畜共患病(禽流感、裂谷热、猴痘等)对公共卫生与贸易的外溢影响
  - id: fao-locust
    name: FAO 沙漠蝗信息网
    url: https://www.fao.org/locusts/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: 沙漠蝗旬报/快报, 含迁移路线预测
  - id: eppo
    name: EPPO(欧洲与地中海植物保护组织)
    url: https://www.eppo.int/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: Reporting Service 植物有害生物新增/扩散通报, 更新及时, 植物疫情首选交叉源
  - id: ippc
    name: IPPC(国际植物保护公约)门户
    url: https://www.ippc.int/en/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: 关注紧急措施通知与 Phytosanitary Resources 更新
  - id: nappo
    name: NAPPO(北美植物保护组织)疫情警报
    url: https://www.pestalerts.org/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en, es]
    method: browse
    notes: 北美植物有害生物警报
  - id: mara
    name: 农业农村部
    url: http://www.moa.gov.cn/
    coverage: [animal, plant, china]
    tier: 1
    schedule: am_pm
    lang: [zh]
    method: browse
    notes: 国内动物疫情发布、植物检疫性有害生物名单动态
  - id: gacc
    name: 海关总署
    url: http://www.customs.gov.cn/
    coverage: [china, measures]
    tier: 1
    schedule: am_pm
    lang: [zh]
    method: browse
    notes: 检索"警示通报""禁止进口""检疫要求"; 是 china-risk-analysis 的关键输入(现有对华措施)

  # ========== Tier 2: 专业早期信号(核验后才可升级) ==========
