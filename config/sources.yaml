# ---- 情报源分级: 1 官方(可直接支撑 verified) / 2 专业(需交叉) / 3 媒体(仅线索) ----
# schedule 档位: am_pm=晨扫+晚扫 / am=仅晨扫 / weekly=每周一晨扫附加 / passive=不主动扫
sources:
  # ========== Tier 1: 官方权威 ==========
  - id: woah-wahis
    name: WOAH WAHIS(世界动物卫生组织疫情信息系统)
    url: https://wahis.woah.org/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    lang: [en, fr]
    method: browse
    notes: 重点看 Immediate notifications 与 Follow-up reports; 全量历史数据需注册 WAHIS API
  - id: fao-empres-i
    name: FAO 全球动物疫病信息系统(EMPRES-i)
    url: https://www.fao.org/global-animal-disease-information-system/en/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    lang: [en]
    method: browse
    notes: 有事件地图与导出; 与 WAHIS 通报高度重叠, 适合做交叉验证
  - id: who-don
    name: WHO 疫情新闻(Disease Outbreak News)
    url: https://www.who.int/emergencies/disease-outbreak-news
    coverage: [human, zoonosis]
    tier: 1
    schedule: am_pm
    lang: [en]
    method: browse
    notes: 关注人畜共患病(禽流感、裂谷热、猴痘等)对公共卫生与贸易的外溢影响
  - id: fao-locust
    name: FAO 沙漠蝗信息网
    url: https://www.fao.org/locusts/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: 沙漠蝗旬报/快报, 含迁移路线预测
  - id: eppo
    name: EPPO(欧洲与地中海植物保护组织)
    url: https://www.eppo.int/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: Reporting Service 植物有害生物新增/扩散通报, 更新及时, 植物疫情首选交叉源
  - id: ippc
    name: IPPC(国际植物保护公约)门户
    url: https://www.ippc.int/en/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en]
    method: browse
    notes: 关注紧急措施通知与 Phytosanitary Resources 更新
  - id: nappo
    name: NAPPO(北美植物保护组织)疫情警报
    url: https://www.pestalerts.org/
    coverage: [plant]
    tier: 1
    schedule: weekly
    lang: [en, es]
    method: browse
    notes: 北美植物有害生物警报
  - id: mara
    name: 农业农村部
    url: http://www.moa.gov.cn/
    coverage: [animal, plant, china]
    tier: 1
    schedule: am_pm
    lang: [zh]
    method: browse
    notes: 国内动物疫情发布、植物检疫性有害生物名单动态
  - id: gacc
    name: 海关总署
    url: http://www.customs.gov.cn/
    coverage: [china, measures]
    tier: 1
    schedule: am_pm
    lang: [zh]
    method: browse
    notes: 对外国政府政策变化的背景源; 中国海关总署公告不进入政策采集台账

  # ========== Tier 2: 专业早期信号(核验后才可升级) ==========
  - id: promed
    name: ProMED-mail (ISID)
    url: https://promedmail.org/
    coverage: [animal, plant, human]
    tier: 2
    schedule: am
    lang: [en]
    method: browse
    notes: 全球最早的疫病早期信号源之一, 植物疫情也有覆盖; 必须经 Tier 1 核验
  - id: cidrap
    name: CIDRAP(明尼苏达大学传染病研究与政策中心)
    url: https://www.cidrap.umn.edu/
    coverage: [animal, human]
    tier: 2
    schedule: am
    lang: [en]
    method: browse
    notes: 禽流感等人畜共患病跟踪报道质量高
  - id: industry-media
    name: 行业媒体(Reuters / ThePigSite / WATTAgNet / AgWeb 等)
    url: https://www.reuters.com/business/healthcare-pharmaceuticals/
    coverage: [animal, plant]
    tier: 2
    schedule: am
    lang: [en]
    method: search
    notes: 通过新闻检索发现线索; 只作线索与交叉源, 不单独支撑 verified

  # ========== Tier 3: 中文媒体(仅线索, 必须回溯原始出处) ==========
  - id: cn-media
    name: 中文新闻媒体
    url: https://news.baidu.com/
    coverage: [animal, plant]
    tier: 3
    schedule: passive
    lang: [zh]
    method: search
    notes: 仅作线索; 必须回溯到 Tier 1 / Tier 2 原始出处, 不得直接采信

  # ========== 以下源自《动物疫情信息参考网站.xlsx》(2026-09 纳入) ==========
  # ---- 中国: 措施与线索 ----
  - id: cn-tbtsps
    name: 中国技术贸易措施网(SPS/TBT通报)
    url: http://www.tbtsps.cn/
    coverage: [measures]
    tier: 1
    schedule: am
    lang: [zh]
    method: browse
    notes: 进境动植物检疫措施与SPS通报查询; 与海关总署措施互为印证
  - id: cn-foodmate
    name: 食品伙伴网·国际新闻
    url: http://news.foodmate.net/guoji/
    coverage: [animal, plant, measures]
    tier: 2
    schedule: am
    lang: [zh]
    method: browse
    notes: 聚合各国进出口食品/农产品检疫动态; 仅作线索, 回溯官方出处
  - id: cn-cahec-std
    name: 中国动物疫病标准委员会(标准名录)
    url: https://std.cahec.cn/
    coverage: [animal, china]
    tier: 1
    schedule: passive
    lang: [zh]
    method: browse
    notes: 疫病名录/标准查询用, 非新闻源; watchlist 扩容时的权威依据
  - id: cn-seafare
    name: 中国渔业博览会(水产资讯)
    url: http://www.seafare.com.cn/
    coverage: [animal]
    tier: 3
    schedule: passive
    lang: [zh]
    method: browse
    notes: 水产行业展会资讯, 信噪比低; 仅水生动物疫情线索时检索

  # ---- 俄罗斯(陆地边境邻国, ASF/HPAI 前线) ----
  - id: ru-fsvps
    name: 俄罗斯联邦兽医和植物检疫监督局(Rosselkhoznadzor)
    url: https://fsvps.gov.ru/ru/vse-soobshcheniya
    coverage: [animal, plant]
    tier: 1
    schedule: am
    lang: [ru]
    method: browse
    notes: 中俄边境动植物检疫官方源, 全部消息含动物/植物通报列表
  - id: ru-rshn-khv
    name: 俄罗斯远东兽医监督局(哈巴罗夫斯克/犹太州/马加丹)
    url: https://rshn-khv-eao.ru/
    coverage: [animal]
    tier: 1
    schedule: am
    lang: [ru]
    method: browse
    notes: 与中国接壤的远东地区兽医通报, 对传入路径评估价值高
  - id: ru-vetandlife
    name: 俄罗斯畜牧业·兽医与生命(vetandlife)
    url: https://vetandlife.ru/category/livestock/
    coverage: [animal]
    tier: 2
    schedule: am
    lang: [ru]
    method: browse
    notes: 俄畜牧兽医行业媒体; 仅作线索
  - id: ru-piginfo
    name: 俄罗斯猪信息网(piginfo.ru)
    url: https://piginfo.ru/
    coverage: [animal]
    tier: 2
    schedule: weekly
    lang: [ru]
    method: browse
    notes: 俄猪业ASF跟踪; 仅作线索
  - id: ru-tass
    name: 塔斯社(TASS English)
    url: https://tass.com/
    coverage: [animal]
    tier: 3
    schedule: passive
    lang: [en]
    method: search
    notes: 国家通讯社; 仅疫情大事件线索, 必须回溯官方出处

  # ---- 欧洲(ASF/HPAI/LSD 活跃疫区与贸易伙伴) ----
  - id: de-fli
    name: 德国弗里德里希洛弗勒研究所(FLI TSIS 动物疾病信息系统)
    url: https://www.tsis.fli.de/Reports/Info.aspx
    coverage: [animal]
    tier: 1
    schedule: am
    lang: [en, de]
    method: browse
    notes: 德国联邦动物卫生研究所疫情报告系统
  - id: pl-wetgiw
    name: 波兰兽医检验局(WetGIW)
    url: https://www.wetgiw.gov.pl/
    coverage: [animal]
    tier: 1
    schedule: am
    lang: [pl]
    method: browse
    notes: 波兰是欧洲ASF主力疫区; Excel该行缺URL, 此处按机构域名补全(首次运行时人工点验)
  - id: uk-daera
    name: 英国北爱尔兰农业环境与农村事务部(DAERA)
    url: https://www.daera-ni.gov.uk/
    coverage: [animal]
    tier: 1
    schedule: am
    lang: [en]
    method: browse
    notes: "Excel注疫区: BSE/SCRAPIE/SB/HPAI"
  - id: no-mattilsynet
    name: 挪威食品安全局
    url: https://www.mattilsynet.no/language/english/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [en, no]
    method: browse
    notes: "Excel注疫区: BSE/SCRAPIE"
  - id: ua-dpss
    name: 乌克兰食品安全与消费者保护国家服务局
    url: https://dpss.gov.ua/en
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [en, uk]
    method: browse
    notes: "Excel注疫区: HPAI/ASF"
  - id: rs-minpolj
    name: 塞尔维亚农业与环境保护部(含兽医局)
    url: http://www.minpolj.gov.rs/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [sr]
    method: browse
    notes: "Excel注疫区: ASF/HPAI/LSD; Excel中 vet.minpolj.gov.rs 实为塞兽医局域名(黑山行错位, 已并入此条)"
  - id: me-gov
    name: 黑山政府门户
    url: http://www.gov.me/naslovna
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [sr]
    method: browse
    notes: "Excel注疫区: HPAI/LSD"
  - id: mk-mzsv
    name: 北马其顿农业林业水利部
    url: http://www.mzsv.gov.mk/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [mk]
    method: browse
    notes: "Excel注疫区: ND; Excel『圣马力诺|政府网|vlada.mk』行URL实为北马其顿政府, 已并入此条备注"
  - id: ba-fbihvlada
    name: 波黑联邦政府(动物疫情通报)
    url: http://www.fbihvlada.gov.ba/bosanski/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [bs]
    method: browse
    notes: "Excel注疫区: AI; 政府门户需站内检索"
  - id: az-afsa
    name: 阿塞拜疆食品安全局(AFSA)
    url: http://afsa.gov.az/
    coverage: [animal]
    tier: 1
    schedule: weekly
    lang: [az]
    method: browse
    notes: 里海周边ASF/HPAI观察; Excel给的是具体新闻页, 此处归一到媒体栏目首页
  - id: by-belta
    name: 白俄罗斯国家通讯社(英文版)
    url: https://eng.belta.by/
    coverage: [animal]
    tier: 3
    schedule: weekly
    lang: [en]
    method: search
    notes: Excel标注ASF; belta为通讯社而非农业部, 仅作线索回溯白俄官方
  - id: ua-112int
    name: 112.international(乌克兰新闻)
    url: https://112.international/
    coverage: [animal]
    tier: 3
    schedule: passive
    lang: [en]
    method: search
    notes: Excel中该行注HPAI/ASF; 新闻站, 仅线索
  - id: sm-consiglio
    name: 圣马力诺大议会(政府门户)
    url: http://www.consigliograndeegenerale.sm/
    coverage: [animal]
    tier: 3
    schedule: passive
    lang: [it]
    method: browse
    notes: 微型国家, 低频观察; 检疫价值有限
  - id: gi-gibraltar
    name: 直布罗陀政府门户
    url: https://www.gibraltar.gov.gi/
    coverage: [animal]
    tier: 3
    schedule: passive
    lang: [en]
    method: browse
    notes: 微型地区, 低频观察; 检疫价值有限

  # ---- 亚太(邻国与主要贸易伙伴) ----
  - id: jp-maff
