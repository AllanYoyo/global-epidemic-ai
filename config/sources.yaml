# ============================================================
# 疫见全球 · 外国政府动植物检疫政策情报源
# 说明:
#   - sources 为政策监测源清单, tier 越小越权威
#   - track 决定该源是否进入 policy 档主动扫描:
#       policy     外国政府/国际组织的政策动作源, policy 档主动扫
#       outbreak   疫情事件源(WAHIS/Promed/行业媒体等), 本分支不扫, 仅作研判背景
#       background 中国侧与标准名录源, 只作影响研判背景, 不进采集台账
#     2026-10 起 policy 档只扫 track=policy 的源: 疫情源在政策分支几乎不产出政策动作,
#     却会吃掉检索预算(实测日产量 1-2 条, 远低于检索到的通报量)。
#   - policy_queries 是生产检索模板, 只面向外国政府/国际组织政策变化
#   - 中国海关总署只作为影响研判背景, 不作为政策记录采集源
#   - 所有 URL 是检索入口;站点改版后由搜索重新定位
# ============================================================

# ---- 政策监测运行档位 ----
runs:
  policy: {time: "07:30", desc: 外国政府政策变化扫, 产出: 政策日报+Word+Excel+推送, track: [policy]}

# ---- 周轮转分片(ISO 星期: 1=周一 .. 7=周日) ----
# 每日只扫当天分片的条目, 保证 7 天全覆盖而单日检索量不随国别数线性膨胀。
# priority_1 / regional / priority_2 无 shard, 每日必扫(18 源)。
# 条目级 shard 优先于档位级 scan: 条目写了 shard 就只在该日扫; 未写的按 scan 整档扫。
# 取值范围 1-7, 同一档内用空格分隔多个星期(如 shard: "1 4" 表示周一与周四)。
# 排期原则: 高价值(欧盟/ePing/邻国)每日或高频; 低频国别分散到 2-3 天一轮。
weekly_shards:
  1: {desc: 周一, scan: []}
  2: {desc: 周二, scan: []}
  3: {desc: 周三, scan: []}
  4: {desc: 周四, scan: []}
  5: {desc: 周五, scan: []}
  6: {desc: 周六, scan: [state_level]}
  7: {desc: 周日, scan: []}
# 周一附加: sources.yaml 中 schedule=weekly 的源(周更通报源, EPPO/NAPPO/FAO 沙漠蝗等)

# ---- 政策监测国家优先级 ----
# 检索主干: global-policy-search 按本结构逐档定位官方源, 不依赖"扫到"。
# shard 字段(可选): 按 ISO 星期几分片(1=周一 .. 7=周日), 周轮转档每日只扫当天分片,
#   保证 7 天全覆盖而单日检索量不随国别数线性膨胀。未写 shard 的档每日必扫。
policy_watch_countries:
  # 每日必扫: 对华主要农产品进口来源地 + 高频通报国家
  # 注: 哈萨克斯坦/蒙古/越南等陆路边境国已归入 border_neighbours(轮转档), 此处不重复
  priority_1:
    - {cn: 加拿大, en: Canada, aliases: [CFIA], source_ids: [ca-cfia]}
    - {cn: 泰国, en: Thailand, aliases: [DLD, DOA], source_ids: [th-dld, th-doa]}
    - {cn: 印度尼西亚, en: Indonesia, aliases: [DVS Indonesia], source_ids: [id-dvs]}
    - {cn: 马来西亚, en: Malaysia, aliases: [DVS Malaysia], source_ids: [my-dvs]}
    - {cn: 菲律宾, en: Philippines, aliases: [BAI, BPI], source_ids: [ph-bai, ph-bpi]}
    - {cn: 印度, en: India, aliases: [DAHD, PPQS], source_ids: [in-dahd, in-ppqs]}
    - {cn: 南非, en: South Africa, aliases: [DALRRD], source_ids: [za-dalrrd]}
    - {cn: 巴西, en: Brazil, aliases: [MAPA, Vigiagro], source_ids: [br-mapa]}
    - {cn: 阿根廷, en: Argentina, aliases: [SENASA], source_ids: [ar-senasa]}
    - {cn: 智利, en: Chile, aliases: [SAG], source_ids: [cl-sag]}
  # 每日必扫: 区域/国际机构措施(不属单一国家, 但直接改变对华准入, 近两日实测唯一稳定产出源)
  regional:
    - {cn: 欧盟委员会卫生与食品安全总司, en: European Commission SANTE, aliases: [SANTE, SERS, emergency measures, Implementing Regulation], source_ids: [eu-sante-sers]}
    - {cn: WTO SPS/TBT 通报预警, en: WTO ePing, aliases: [ePing, G/SPS/N, SPS notification], source_ids: [wto-eping]}
    - {cn: 国际植物保护公约, en: IPPC, aliases: [IPPC, ISPM, ePhyto, emergency measures], source_ids: [ippc]}
    # 欧亚经济委员会: 与欧盟同构的区域统一立法主体, 样例高频命中
    - {cn: 欧亚经济委员会(欧亚经济联盟), en: Eurasian Economic Commission, aliases: [EEC, EAEU, Eurasian Economic Union, 关税同盟], source_ids: [eaeu-eec, eaeu-eec-sps-news]}
    # 中文 SPS/TBT 通报平台: 中国官方通报体系的中文权威转述, 日产量最高(2026-10-15 确认放宽)
    # 2026-10-18 调整: aliases 去掉"技术性贸易措施网"——该 alias 强绑 tbtsps.cn,
    # 而 tbtsps.cn 已撤除(见 cn-sps-aggregator 红线段); 保留"通报咨询中心/TBT通报/SPS通报"
    # 这些省级/商务部站仍用的描述。
    - {cn: 中文SPS/TBT通报平台, en: China WTO/TBT-SPS notification portals, aliases: [通报咨询中心, TBT通报, SPS通报], source_ids: [cn-sps-aggregator]}
  # 陆路边境邻国: 传入路径优先(封锁区/暂停进口动辄直指对华通道)
  # shard 排期: ASF/HPAI 常年活跃的高疫区邻国(俄/越/哈/蒙)每日必扫;
  #             其余按 2-3 天一轮分片, 保证 7 天全覆盖。
  border_neighbours:
    - {cn: 俄罗斯, en: Russia, aliases: [Rosselkhoznadzor, FSVS, Rosselkhoz], source_ids: [ru-fsvps, ru-rshn-khv], shard: "1 2 3 4 5 6 7"}
    - {cn: 越南, en: Vietnam, aliases: [MARD, DAH], source_ids: [vn-mard], shard: "1 2 3 4 5 6 7"}
    - {cn: 哈萨克斯坦, en: Kazakhstan, aliases: [Kazakhstan Agriculture], source_ids: [kz-agri], shard: "1 2 3 4 5 6 7"}
    - {cn: 蒙古, en: Mongolia, aliases: [Mongolia Veterinary], source_ids: [mn-vet], shard: "1 2 3 4 5 6 7"}
    - {cn: 日本, en: Japan, aliases: [MAFF], source_ids: [jp-maff], shard: "1 3 5"}
    - {cn: 韩国, en: South Korea, aliases: [MAFRA], source_ids: [kr-mafra], shard: "2 4 6"}
    - {cn: 土耳其, en: Turkey, aliases: [Tarim ve Orman Bakanligi], source_ids: [tr-tarimorman], shard: "1 4"}
    - {cn: 老挝, en: Laos, aliases: [MAFD, 农业与林业部], source_ids: [la-mafd], shard: "2 5"}
    - {cn: 缅甸, en: Myanmar, aliases: [MOA, 农业与灌溉部], source_ids: [mm-myanmar], shard: "3 6"}
    - {cn: 朝鲜, en: North Korea, aliases: [中央兽防疫指导局], source_ids: [kp-vet], shard: "4"}
    - {cn: 波兰, en: Poland, aliases: [WetGIW], source_ids: [pl-wetgiw], shard: "1 5"}
    - {cn: 塞尔维亚, en: Serbia, aliases: [Minpolj], source_ids: [rs-minpolj], shard: "2 6"}
    - {cn: 乌克兰, en: Ukraine, aliases: [DPSS], source_ids: [ua-dpss], shard: "3"}
    - {cn: 罗马尼亚, en: Romania, aliases: [ANSVSA], source_ids: [ro-ansvsa], shard: "4 7"}
    - {cn: 挪威, en: Norway, aliases: [Mattilsynet], source_ids: [no-mattilsynet], shard: "5"}
    - {cn: 阿塞拜疆, en: Azerbaijan, aliases: [AFSA], source_ids: [az-afsa], shard: "7"}
  # 对华出口大户(反向措施): 其检疫要求变动常触发对华准入摩擦
  # 注: 欧盟成员国不在此列——欧盟动植物检疫规则为欧盟层面统一立法
  #     (植物健康 Reg (EU) 2016/2031 / 动物健康 Reg (EU) 2019/2131),
  #     紧急措施由 SANTE 以实施条例与 SERS 发布, 成员国执行细则空间极小。
  #     欧盟议题统一由 regional 档的 eu-sante-sers 覆盖, 不按成员国重复扫描。
  export_partners:
    - {cn: 澳大利亚, en: Australia, aliases: [Department of Agriculture], source_ids: [au-agriculture], shard: "1 3 5"}
    - {cn: 新西兰, en: New Zealand, aliases: [MPI, Beehive, Biosecurity], source_ids: [nz-beehive], shard: "2 4 6"}
    - {cn: 乌拉圭, en: Uruguay, aliases: [MGAP, DGSG], source_ids: [uy-mgap], shard: "1 4 7"}
    - {cn: 巴西, en: Brazil, aliases: [MAPA], source_ids: [br-mapa], shard: "2 5"}
    - {cn: 沙特阿拉伯, en: Saudi Arabia, aliases: [MEWA, 兽医检疫], source_ids: [sa-mewa], shard: "3 6"}
    - {cn: 墨西哥, en: Mexico, aliases: [SENASICA], source_ids: [mx-senasica], shard: "1"}
    - {cn: 阿根廷, en: Argentina, aliases: [SENASA], source_ids: [ar-senasa], shard: "3"}
    # 英国已脱欧, 保留自有 IHS 与官方兽医体系, 不随欧盟规则走
    - {cn: 英国, en: United Kingdom, aliases: [DEFRA, APHA], source_ids: [uk-defra], shard: "2 6"}
  # 每日必扫: 主要贸易伙伴的联邦级措施
  priority_2:
    - {cn: 美国, en: United States, aliases: [USDA APHIS, Federal Order, state agriculture departments], source_ids: [usda-aphis, us-state-agri]}
  # 州级通道: 美国各州农业/兽医/植检部门, 动作量级大于联邦
  state_level:
    - {cn: 美国州级农业部门, en: US state agriculture departments, aliases: [state veterinarian, state plant regulatory official], source_ids: [us-state-agri]}
    - {cn: 北爱尔兰农业环境与农村事务部, en: UK DAERA Northern Ireland, aliases: [DAERA], source_ids: [uk-daera]}
    - {cn: 德国动物疾病信息系统, en: Germany FLI TSIS, aliases: [FLI, TSIS], source_ids: [de-fli]}
    - {cn: 哥伦比亚农业部, en: Colombia MinAgricultura, aliases: [MinAgricultura, ICA], source_ids: [co-minagricultura]}

# ---- 情报源分级: 1 官方(可直接支撑 verified) / 2 专业(需交叉) / 3 媒体(仅线索) ----
# schedule 档位: am_pm=晨扫+晚扫 / am=仅晨扫 / daily=每日政策档 / weekly=每周一晨扫附加 / passive=不主动扫
# track 轨道: policy=政策动作源(policy 档主动扫) / outbreak=疫情事件源(不扫, 仅研判背景) / background=中国侧与名录(不扫, 仅背景)
sources:
  # ========== Tier 1: 官方权威 ==========
  - id: woah-wahis
    name: WOAH WAHIS(世界动物卫生组织疫情信息系统)
    url: https://wahis.woah.org/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    track: outbreak
    lang: [en, fr]
    method: browse
    notes: 重点看 Immediate notifications 与 Follow-up reports; 全量历史数据需注册 WAHIS API
  - id: fao-empres-i
    name: FAO 全球动物疫病信息系统(EMPRES-i)
    url: https://www.fao.org/global-animal-disease-information-system/en/
    coverage: [animal]
    tier: 1
    schedule: am_pm
    track: outbreak
    lang: [en]
    method: browse
    notes: 有事件地图与导出; 与 WAHIS 通报高度重叠, 适合做交叉验证
  - id: who-don
    name: WHO 疫情新闻(Disease Outbreak News)
    url: https://www.who.int/emergencies/disease-outbreak-news
    coverage: [human, zoonosis]
    tier: 1
    schedule: am_pm
    track: outbreak
    lang: [en]
    method: browse
    notes: 关注人畜共患病(禽流感、裂谷热、猴痘等)对公共卫生与贸易的外溢影响
  - id: fao-locust
    name: FAO 沙漠蝗信息网
    url: https://www.fao.org/locusts/
    coverage: [plant]
    tier: 1
    schedule: weekly
    track: outbreak
    lang: [en]
    method: browse
    notes: 沙漠蝗旬报/快报, 含迁移路线预测
  - id: eppo
    name: EPPO(欧洲与地中海植物保护组织)
    url: https://www.eppo.int/
    coverage: [plant]
    tier: 1
    schedule: weekly
    track: outbreak
    lang: [en]
    method: browse
    notes: Reporting Service 植物有害生物新增/扩散通报, 更新及时, 植物疫情首选交叉源
  - id: ippc
    name: IPPC(国际植物保护公约)门户
    url: https://www.ippc.int/en/
    coverage: [plant]
    tier: 1
    schedule: weekly
    track: policy
    lang: [en]
    method: browse
    notes: 关注紧急措施通知与 Phytosanitary Resources 更新
  - id: nappo
    name: NAPPO(北美植物保护组织)疫情警报
    url: https://www.pestalerts.org/
    coverage: [plant]
    tier: 1
    schedule: weekly
    track: outbreak
    lang: [en, es]
    method: browse
    notes: 北美植物有害生物警报
  - id: mara
    name: 农业农村部
    url: http://www.moa.gov.cn/
    coverage: [animal, plant, china]
    tier: 1
    schedule: am_pm
    track: background
    lang: [zh]
    method: browse
    notes: 国内动物疫情发布、植物检疫性有害生物名单动态
  - id: gacc
    name: 海关总署
    url: http://www.customs.gov.cn/
    coverage: [china, measures]
    tier: 1
    schedule: am_pm
    track: background
    lang: [zh]
    method: browse
    notes: 对外国政府政策变化的背景源; 中国海关总署公告不进入政策采集台账

  # ========== Tier 2: 专业早期信号(核验后才可升级) ==========
  - id: promed
    name: ProMED-mail (ISID)
    url: https://promedmail.org/
    coverage: [animal, plant, human]
    tier: 2
    schedule: am
    track: outbreak
    lang: [en]
    method: browse
    notes: 全球最早的疫病早期信号源之一, 植物疫情也有覆盖; 必须经 Tier 1 核验
  - id: cidrap
    name: CIDRAP(明尼苏达大学传染病研究与政策中心)
    url: https://www.cidrap.umn.edu/
    coverage: [animal, human]
    tier: 2
    schedule: am
    track: outbreak
    lang: [en]
    method: browse
    notes: 禽流感等人畜共患病跟踪报道质量高
  - id: industry-media
    name: 行业媒体(Reuters / ThePigSite / WATTAgNet / AgWeb 等)
    url: https://www.reuters.com/business/healthcare-pharmaceuticals/
    coverage: [animal, plant]
    tier: 2
    schedule: am
    track: outbreak
    lang: [en]
    method: search
    notes: 通过新闻检索发现线索; 只作线索与交叉源, 不单独支撑 verified

  # ========== Tier 3: 中文媒体(仅线索, 必须回溯原始出处) ==========
  - id: cn-media
    name: 中文新闻媒体
    url: https://news.baidu.com/
    coverage: [animal, plant]
    tier: 3
    schedule: passive
    track: background
    lang: [zh]
    method: search
    notes: 仅作线索; 必须回溯到 Tier 1 / Tier 2 原始出处, 不得直接采信

  # ========== 以下源自《动物疫情信息参考网站.xlsx》(2026-09 纳入) ==========
  # ---- 中国: 措施与线索 ----
  - id: cn-tbtsps
    name: 中国技术贸易措施网(SPS/TBT通报)
    url: http://www.tbtsps.cn/
    coverage: [measures]
    tier: 1
    schedule: am
    track: background
    lang: [zh]
    method: browse
    notes: 进境动植物检疫措施与SPS通报查询; 与海关总署措施互为印证
  - id: cn-foodmate
    name: 食品伙伴网·国际新闻
    url: http://news.foodmate.net/guoji/
    coverage: [animal, plant, measures]
    tier: 2
    schedule: am
    track: background
    lang: [zh]
    method: browse
    notes: 聚合各国进出口食品/农产品检疫动态; 仅作线索, 回溯官方出处
  - id: cn-cahec-std
    name: 中国动物疫病标准委员会(标准名录)
    url: https://std.cahec.cn/
    coverage: [animal, china]
    tier: 1
    schedule: passive
    track: background
    lang: [zh]
    method: browse
    notes: 疫病名录/标准查询用, 非新闻源; watchlist 扩容时的权威依据
  - id: cn-seafare
    name: 中国渔业博览会(水产资讯)
    url: http://www.seafare.com.cn/
    coverage: [animal]
    tier: 3
    schedule: passive
    track: background
    lang: [zh]
    method: browse
    notes: 水产行业展会资讯, 信噪比低; 仅水生动物疫情线索时检索
  # ---- 中文 SPS/TBT 通报平台(2026-10 按样例补; 2026-10-15 经确认放宽为 tier 1) ----
  # 实测(2026-10-15): 单次检索可返回 8 条带完整通报号/生效日期/评议期的记录,
  # 且标题已是可直接入库的中文规范表述; 同期英文 `site:` + 长自然语言 0 命中。
  # 性质核实: 主办方为海关总署标法中心(WTO/TBT-SPS 国家通报咨询中心)、商务部及
  # 省级 TBT 通报咨询中心, 属中国官方通报体系对 WTO 原始通报的中文权威转述,
  # 不是商业聚合站 → 放宽为 tier: 1 + track: policy, 可直接支撑 verified。
  - id: cn-sps-aggregator
    name: 中文 SPS/TBT 通报平台(海关总署标法中心/商务部/省级 TBT 咨询中心)
    url: https://www.gdtbt.org.cn/sps.aspx
    coverage: [measures]
    tier: 1
    schedule: daily
    track: policy
    lang: [zh]
    method: search
    notes: |
      日产量最高的通道(实测单次 8 条), 且是唯一能稳定产出"中文规范标题 + 通报号 +
      生效日期 + 评议期"四件套的来源。经确认放宽为 tier 1 官方源, 可直接支撑 verified。
      使用要求:
        - 只认官方主办站(gdtbt.org.cn / hntbt.org.cn / gxzl.org.cn / wzisps.org.cn /
          chinawto.mofcom.gov.cn, 共 5 个省级/商务部站);
          2026-10-18 撤除 tbtsps.cn(海关总署标法中心), 该源 URL 不可再作 tier 1,
          命中即被 normalize 强制降 tier 3;
        - .com/.org 商业聚合站仍按第三方处理, 强制降 tier 3 且不得判 verified;
        - source.title 填 G/SPS/N 文号, publish_date 填通报发布日(非转载日),
          quote 取通报原文关键段(≤120 字), 不得用平台自加的"分析提醒/企业提示"当引文;
        - 涉及中国自身措施的内容(海关总署公告、商务部贸易环境专刊)不入政策台账,
          按 AGENTS.md 约定仅作影响研判背景。
      省级平台首页常对直连返回 403, 以 web_search 检索式命中为主, browse 为辅。
  - id: cn-protocol
    name: 中国海关双边检疫议定书公告(输华准入背景源)
    url: http://www.customs.gov.cn/
