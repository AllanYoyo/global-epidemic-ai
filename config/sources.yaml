# ---- 政策关键词词库(global-policy-search 检索与抽取共用; 每条 {cn, en, aliases[]}) ----
# 用法: 检索时"国家 × 关键词组 × 动作词"组合; 抽取时用于识别政策主题与同义词归一。
# 范围: 动物与植物; 不含中国海关总署。
