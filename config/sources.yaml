# ---- 每日例行检索模板; 占位符: {disease_en} {disease_cn} {country} {country_cn} {month_en_year} {year} ----
search_queries:
  official:
    - 'site:wahis.woah.org "{disease_en}" immediate notification {month_en_year}'
    - '"{disease_en}" outbreak "{country}" site:fao.org'
    - '"{disease_en}" "{country}" EPPO reporting service'
    - '"{disease_cn}" 疫情 农业农村部 {year}'
  early_signal:
    - '"{disease_en}" "{country}" promed'
    - '"{disease_en}" outbreak "{country}" news {month_en_year}'
  china:
    - '"{disease_cn}" OR "{disease_en}" 海关总署 警示通报 禁止进口'
    - '"{disease_cn}" {country_cn} 出口 暂停'

# ---- 政策变化监测检索模板(global-policy-search Skill / policy 分支) ----
# 范围: 仅外国政府的动植物检疫管控政策变化。
# 中国海关总署公告不作为政策记录采集 —— 对华口岸措施由 china-risk-analysis 按事件
# 按需检索(search_queries.china), 这里重复收集没有增量价值。
policy_queries:
  sps:         # WTO SPS 通报(各成员措施变化官方渠道)
    - 'site:eping.wto.org SPS emergency measure animal {month_en_year}'
    - 'site:eping.wto.org SPS plant phytosanitary {month_en_year}'
    - 'G/SPS/N "{disease_en}" OR "import suspension" {year}'
  official:    # 重点伙伴官方检疫机构公告
    - '"{country}" suspends imports livestock "animal health" {month_en_year}'
    - '"{country}" lifts ban imports poultry OR beef OR pork {month_en_year}'
    - 'site:aphis.usda.gov import ban OR suspension {month_en_year}'
    - '"European Commission" SERS "emergency measures" animal health {month_en_year}'
    - '"{country}" import suspension OR ban "{disease_en}" {month_en_year}'
  reactive:    # 高关注疫情引发的他国连带反应(需疫情事件驱动)
    - '"{disease_en}" "{country}" "suspends imports" OR "bans imports" {month_en_year}'
    - '"{disease_en}" outbreak "{country}" trade ban beef OR pork OR poultry {month_en_year}'
