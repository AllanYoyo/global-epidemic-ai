  # -- 核心主题与机制 --
  organizations:
    - {cn: SPS 通报(卫生与植物卫生措施), en: SPS notification, aliases: ["sanitary and phytosanitary measures", "G/SPS/N/", "ePing"]}
    - {cn: 进口卫生标准, en: import health standards, aliases: ["IHS", "import health requirement"]}
    - {cn: 动物源性产品检疫, en: animal origin product inspection, aliases: ["animal by-products", "processed animal protein"]}
    - {cn: 跨境动物疾病, en: transboundary animal diseases, aliases: ["TADs"]}
    - {cn: 生物安全法, en: biosecurity law/act, aliases: ["biosecurity legislation", "biosafety act"]}
    - {cn: 世界动物卫生组织, en: WOAH, aliases: ["OIE", "World Organisation for Animal Health"]}
    - {cn: 联合国粮农组织, en: FAO, aliases: ["Food and Agriculture Organization"]}
